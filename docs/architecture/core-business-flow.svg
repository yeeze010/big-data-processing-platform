<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 980">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 10px; }
      .step-title { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .step-sub { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
      .label { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #34d399; stroke-width: 1.7; marker-end: url(#arrow-green); }
      .line-rose { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-rose); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="36" y="42" class="title">大数据处理平台 - 核心业务流程</text>
  <text x="36" y="62" class="sub">Source Test -> Ingest/Sync -> Transform -> Workflow -> Schedule -> Quality -> Asset/Lineage -> Audit</text>

  <rect x="430" y="100" width="240" height="58" rx="29" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="550" y="126" class="step-title">开始：创建数据源</text>
  <text x="550" y="143" class="step-sub">连接配置 / 凭据引用 / 负责人</text>

  <line x1="550" y1="158" x2="550" y2="210" class="line-green"/>
  <polygon points="550,210 625,260 550,310 475,260" fill="#0f172a"/>
  <polygon points="550,210 625,260 550,310 475,260" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="550" y="257" class="step-title">连通成功?</text>
  <text x="550" y="274" class="step-sub">网络 / 权限 / 凭据</text>

  <line x1="550" y1="310" x2="550" y2="365" class="line-green"/>
  <text x="570" y="340" fill="#34d399" font-size="9">是</text>
  <path d="M625 260 L805 260 L805 385" class="line-rose"/>
  <text x="720" y="248" fill="#fb7185" font-size="9">否</text>

  <rect x="430" y="365" width="240" height="64" rx="6" fill="#0f172a"/>
  <rect x="430" y="365" width="240" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="550" y="392" class="step-title">配置采集/同步任务</text>
  <text x="550" y="410" class="step-sub">全量 / 增量 / 字段映射 / 断点</text>

  <rect x="695" y="385" width="220" height="64" rx="6" fill="#0f172a"/>
  <rect x="695" y="385" width="220" height="64" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="805" y="412" class="step-title">修复连接问题</text>
  <text x="805" y="430" class="step-sub">更新凭据 / 网络 / 白名单</text>
  <path d="M805 449 L805 500 L670 500" class="line"/>

  <line x1="550" y1="429" x2="550" y2="495" class="line-green"/>
  <rect x="430" y="495" width="240" height="64" rx="6" fill="#0f172a"/>
  <rect x="430" y="495" width="240" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="550" y="522" class="step-title">清洗转换聚合</text>
  <text x="550" y="540" class="step-sub">标准化 / 去重 / 聚合 / 脱敏</text>

  <line x1="550" y1="559" x2="550" y2="625" class="line-green"/>
  <rect x="430" y="625" width="240" height="64" rx="6" fill="#0f172a"/>
  <rect x="430" y="625" width="240" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="550" y="652" class="step-title">编排工作流 DAG</text>
  <text x="550" y="670" class="step-sub">依赖 / 参数 / 发布 / 版本</text>

  <line x1="550" y1="689" x2="550" y2="750" class="line-green"/>
  <polygon points="550,750 625,800 550,850 475,800" fill="#0f172a"/>
  <polygon points="550,750 625,800 550,850 475,800" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="550" y="797" class="step-title">运行成功?</text>
  <text x="550" y="814" class="step-sub">调度 / 执行 / 日志</text>

  <path d="M475 800 L260 800 L260 657 L430 657" class="line-rose"/>
  <text x="365" y="787" fill="#fb7185" font-size="9">否：失败重试 / 节点重跑</text>
  <line x1="625" y1="800" x2="760" y2="800" class="line-green"/>
  <text x="685" y="787" fill="#34d399" font-size="9">是</text>

  <rect x="760" y="768" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="760" y="768" width="230" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="875" y="795" class="step-title">数据质量检测</text>
  <text x="875" y="813" class="step-sub">规则 / 报告 / 异常样本</text>

  <line x1="875" y1="768" x2="875" y2="700" class="line"/>
  <rect x="760" y="620" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="760" y="620" width="230" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="647" class="step-title">登记数据资产</text>
  <text x="875" y="665" class="step-sub">目录 / 标签 / 生命周期</text>

  <line x1="875" y1="620" x2="875" y2="555" class="line"/>
  <rect x="760" y="485" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="760" y="485" width="230" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="875" y="512" class="step-title">生成血缘关系</text>
  <text x="875" y="530" class="step-sub">表级 / 字段级 / 影响分析</text>

  <line x1="875" y1="485" x2="875" y2="420" class="line"/>
  <rect x="760" y="335" width="230" height="64" rx="6" fill="#0f172a"/>
  <rect x="760" y="335" width="230" height="64" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="875" y="362" class="step-title">告警与审计</text>
  <text x="875" y="380" class="step-sub">通知 / 数据访问 / 操作留痕</text>

  <line x1="875" y1="335" x2="875" y2="270" class="line"/>
  <rect x="760" y="205" width="230" height="58" rx="29" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="875" y="231" class="step-title">结束：验收可追溯</text>
  <text x="875" y="248" class="step-sub">产物 / 报告 / 审计 / Release</text>
</svg>
