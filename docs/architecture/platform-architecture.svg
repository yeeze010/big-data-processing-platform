<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 880">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
      .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .sub { fill: #94a3b8; font-size: 10px; }
      .region { fill: none; stroke: #fbbf24; stroke-width: 1; stroke-dasharray: 8 4; }
      .region-label { fill: #fbbf24; font-size: 10px; font-weight: 600; }
      .box-mask { fill: #0f172a; }
      .box-title { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .box-sub { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
      .tiny { fill: #94a3b8; font-size: 8px; text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow); }
      .line-cyan { fill: none; stroke: #22d3ee; stroke-width: 1.5; marker-end: url(#arrow-cyan); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
